<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Kistin</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body data-page="inventory.html">
        <aside id="side"></aside>
        <main>
            <header class="top">
                <div>
                    <p class="eyebrow">Live stock</p>
                    <h1>Your inventory</h1>
                    <p class="sub">Everything Kistin can currently see in your kitchen.</p>
                </div>
                <button class="btn" id="add">+ Add item</button>
            </header>
            <div class="toolbar">
                <input id="q" placeholder="Search your kitchen...">
                <div class="chip">
                    <button class="on" data-f="All">All</button>
                    <button data-f="Pantry">Pantry</button>
                    <button data-f="Fridge">Fridge</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ITEM</th>
                        <th>LOCATION</th>
                        <th>EXPIRY ESTIMATE</th>
                        <th>QUANTITY</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
            <dialog id="dlg">
                <form id="form">
                    <h3>Add item</h3>
                    <label>Name</label>
                    <input id="n" required>
                    <label>Location</label>
                    <select id="l">
                        <option>Fridge</option>
                        <option>Pantry</option>
                    </select>
                    <label>Quantity</label>
                    <input id="qt" placeholder="e.g. 2 packs">
                    <label>Days until expiry (blank = long life)</label>
                    <input id="d" type="number" min="0">
                    <br>
                    <br>
                    <div class="row">
                        <button type="button" class="btn ghost" id="cancel">Cancel</button>
                        <button class="btn">Add</button>
                    </div>
                </form>
            </dialog>
            <div class="toast" id="toast"></div>
            <script src="js/data.js"></script>
            <script src="js/app.js"></script>
    </body>
</html>
